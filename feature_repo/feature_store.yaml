project: ridematch
registry: data/registry.db
provider: local

# Use MinIO (S3-compatible) as the offline store via the S3OfflineStore.
# Credentials are read from env vars (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, etc.).
offline_store:
  type: file    # PyArrow will access s3:// paths using env credentials (MinIO)

online_store:
  type: redis
  # Expanded via Feast's os.path.expandvars: localhost:6379 on the host,
  # redis:6379 inside a container (set in Dockerfile/docker-compose).
  # minio_config.py's SERVICES.export_env() guarantees these are always set
  # before Feast parses this file, even on the host where nothing exports them.
  connection_string: "${REDIS_HOST}:${REDIS_PORT}"
