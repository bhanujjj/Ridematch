project: ridematch_local
entity_key_serialization_version: 2
# Relative to repo_path, same convention as feature_store.yaml -- avoids
# hardcoding a path tied to one machine/user.
registry: data/registry_local.db
provider: local

offline_store:
  type: file

online_store:
  type: sqlite
  path: data/online_store_local.db
