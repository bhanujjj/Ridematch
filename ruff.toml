[lint]
# Ruff with zero config implicitly pulls in extended categories (blind-except,
# datetime-tz, bandit security, async-blocking, ...) whose defaults drift
# between versions. Pin an explicit, standard baseline (pycodestyle errors,
# pyflakes, unused imports/vars) instead of the broader opinionated set --
# this codebase deliberately uses broad `except Exception` for graceful
# startup degradation (see src/match_api/main.py lifespan handler), which is
# a design choice, not an oversight.
