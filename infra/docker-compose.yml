# RideMatch local infrastructure.
#
# Notes on choices:
#  - Kafka runs in KRaft mode (no Zookeeper). wurstmeister/kafka is abandoned
#    and unpinned; confluentinc/cp-kafka is the maintained image.
#  - Every image is pinned. "latest" makes the stack non-reproducible, which is
#    the first thing an interviewer will poke at.
#  - MLflow uses Postgres, not SQLite. SQLite has a single writer and locks
#    under concurrent runs.
#  - Healthchecks + depends_on.condition remove the "sleep 30 and hope" pattern.
name: ridematch

x-minio-creds: &minio-creds
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # --- KRaft (Zookeeper-less) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Two listeners: INTERNAL for container-to-container, EXTERNAL for host.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single-broker dev cluster: replication must be 1 or topics never elect.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
       --topic ridematch-events --partitions 3 --replication-factor 1 &&
       echo 'topic ridematch-events ready'"
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY are deprecated and silently ignored
      # by current MinIO releases -- use ROOT_USER / ROOT_PASSWORD.
      <<: *minio-creds
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-creds
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
       mc mb --ignore-existing local/ridematch-raw &&
       mc mb --ignore-existing local/mlflow-artifacts &&
       echo 'buckets ready'"
    restart: "no"

  mlflow-db:
    image: postgres:16-alpine
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 15

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Artifacts go to MinIO (S3), not a bind mount -- this is what makes the
      # model registry portable rather than tied to one laptop.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5050:5000"
    # psycopg2 + boto3 are not in the base image.
    entrypoint: ["/bin/sh", "-c"]
    # NOTE: every continuation line below must share the same indentation.
    # A folded (">") scalar only joins lines with a space when they're at
    # the *same* indent as the first; a more-indented line (this bit us
    # once already) is instead preserved with a literal newline, which
    # turns "mlflow server" into a bare, argument-less statement that sh
    # runs and blocks on forever -- silently dropping --host/--port/etc.
    command: >
      "pip install --no-cache-dir psycopg2-binary boto3 >/dev/null &&
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  prefect:
    image: prefecthq/prefect:2.19-python3.11
    container_name: prefect
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboard are provisioned automatically -- no manual
      # click-through in the Grafana UI after a fresh `compose up`.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/ridematch.json:ro
    depends_on:
      - prometheus

volumes:
  kafka_data:
  redis_data:
  mlflow_pg:
  prefect_data:
  prometheus_data:
  grafana_data:
